<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RNUconnect – Riga Nordic University Alumni Network</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
--maroon: #1A5DC8;
--maroon-deep: #0F3D8A;
--maroon-light: #2D72E0;
--gold: #3B8EEA;
--gold-light: #7AB8F5;
--cream: #7AB8F5;
--white: #EEF6FF;
--gray-50: #5EA8EE;
--gray-100: #C5DEFA;
--gray-200: #A0CAEE;
--gray-400: #7A99C2;
--gray-600: #3D5A80;
--gray-800: #0D1F3C;
--shadow-sm: 0 2px 8px rgba(26,93,200,0.08);
--shadow-md: 0 8px 32px rgba(26,93,200,0.14);
--shadow-lg: 0 20px 60px rgba(26,93,200,0.18);
--radius: 12px;
--radius-lg: 20px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
font-family: 'DM Sans', sans-serif;
background: var(--cream);
color: var(--gray-800);
overflow-x: hidden;
}
/* ── NAVIGATION ── */
nav {
position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
background: rgba(255,255,255,0.92);
backdrop-filter: blur(16px);
border-bottom: 1px solid #C5DEFA;
height: 64px;
display: flex; align-items: center;
padding: 0 32px;
transition: box-shadow 0.3s;
}
nav.scrolled { box-shadow: var(--shadow-sm); }
.nav-inner {
width: 100%; max-width: 1280px; margin: 0 auto;
display: flex; align-items: center; gap: 32px;
}
.logo {
display: flex; align-items: center; gap: 12px;
text-decoration: none; flex-shrink: 0;
}
.logo-mark {
width: 38px; height: 38px;
background: var(--maroon);
border-radius: 10px;
display: flex; align-items: center; justify-content: center;
position: relative; overflow: hidden;
}
.logo-mark::after {
content: 'R';
color: #7AB8F5;
font-family: 'Cormorant Garamond', serif;
font-size: 22px; font-weight: 700;
position: relative; z-index: 1;
}
.logo-text {
font-family: 'Cormorant Garamond', serif;
font-size: 20px; font-weight: 700;
color: var(--maroon);
letter-spacing: -0.3px;
}
.logo-text span { color: var(--gold); }
.nav-links {
display: flex; align-items: center; gap: 4px;
list-style: none; flex: 1;
}
.nav-links a {
text-decoration: none; color: var(--gray-600);
font-size: 13.5px; font-weight: 500;
padding: 6px 12px; border-radius: 8px;
transition: all 0.2s;
white-space: nowrap;
}
.nav-links a:hover { color: var(--maroon); background: rgba(107,27,42,0.06); }
.nav-links a.active { color: var(--maroon); font-weight: 600; }
.nav-actions { display: flex; gap: 10px; align-items: center; margin-left: auto; }

/* ── User menu (shown when logged in) ── */
.user-menu { display: none; align-items: center; gap: 10px; }
.user-menu.visible { display: flex; }
.user-avatar-nav {
width: 34px; height: 34px; border-radius: 9px;
display: flex; align-items: center; justify-content: center;
font-family: 'Cormorant Garamond', serif;
font-size: 15px; font-weight: 700; color: white;
cursor: pointer;
}
.user-name-nav { font-size: 13.5px; font-weight: 600; color: var(--gray-800); }
.btn-signout {
background: transparent; border: 1.5px solid var(--gray-100);
color: var(--gray-400); font-family: 'DM Sans', sans-serif;
font-size: 12px; font-weight: 600; padding: 6px 14px;
border-radius: 8px; cursor: pointer; transition: all 0.2s;
}
.btn-signout:hover { border-color: #e55; color: #e55; }

.btn {
display: inline-flex; align-items: center; gap: 8px;
padding: 8px 20px; border-radius: 10px;
font-family: 'DM Sans', sans-serif;
font-size: 13.5px; font-weight: 600;
cursor: pointer; transition: all 0.2s; border: none; text-decoration: none;
}
.btn-outline {
background: transparent;
border: 1.5px solid var(--gray-200);
color: var(--gray-600);
}
.btn-outline:hover { border-color: var(--maroon); color: var(--maroon); }
.btn-primary {
background: var(--maroon);
color: white;
box-shadow: 0 2px 12px rgba(107,27,42,0.25);
}
.btn-primary:hover { background: var(--maroon-deep); transform: translateY(-1px); box-shadow: 0 4px 20px rgba(107,27,42,0.35); }
.btn-gold {
background: linear-gradient(135deg, #2D72E0, #7AB8F5);
color: white;
box-shadow: 0 2px 12px rgba(45,114,224,0.35);
}
.btn-gold:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(45,114,224,0.45); }
.btn-lg { padding: 14px 32px; font-size: 15px; border-radius: 12px; }
/* ── HERO ── */
.hero {
min-height: 100vh;
background: var(--maroon-deep);
position: relative; overflow: hidden;
display: flex; align-items: center;
padding-top: 64px;
}
.hero-bg {
position: absolute; inset: 0;
background:
radial-gradient(ellipse 80% 60% at 60% 30%, rgba(122,184,245,0.15) 0%, transparent 70%),
radial-gradient(ellipse 50% 80% at 20% 70%, rgba(26,93,200,0.5) 0%, transparent 60%);
}
.hero-grid {
position: absolute; inset: 0;
background-image:
linear-gradient(rgba(122,184,245,0.07) 1px, transparent 1px),
linear-gradient(90deg, rgba(122,184,245,0.07) 1px, transparent 1px);
background-size: 60px 60px;
mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black, transparent);
}
.hero-inner {
width: 100%; max-width: 1280px; margin: 0 auto;
padding: 80px 32px;
display: grid; grid-template-columns: 1fr 420px; gap: 80px; align-items: center;
position: relative; z-index: 1;
}
.hero-badge {
display: inline-flex; align-items: center; gap: 8px;
background: rgba(201,151,58,0.15);
border: 1px solid rgba(201,151,58,0.3);
border-radius: 100px; padding: 6px 16px;
margin-bottom: 24px;
}
.hero-badge-dot {
width: 6px; height: 6px; border-radius: 50%;
background: var(--gold-light); animation: pulse 2s infinite;
}
@keyframes pulse {
0%,100% { opacity: 1; transform: scale(1); }
50% { opacity: 0.5; transform: scale(0.8); }
}
.hero-badge span { font-size: 12px; font-weight: 500; color: var(--gold-light); letter-spacing: 0.5px; }
.hero-title {
font-family: 'Cormorant Garamond', serif;
font-size: clamp(48px, 6vw, 80px);
font-weight: 700; line-height: 1.05;
color: white;
margin-bottom: 24px;
}
.hero-title em { font-style: italic; color: var(--gold-light); }
.hero-desc {
font-size: 17px; line-height: 1.7;
color: rgba(255,255,255,0.65);
max-width: 540px; margin-bottom: 40px;
}
.hero-actions { display: flex; gap: 14px; flex-wrap: wrap; }
.hero-stats {
display: flex; gap: 32px; margin-top: 56px;
border-top: 1px solid rgba(255,255,255,0.1);
padding-top: 32px;
}
.hero-stat-num {
font-family: 'Cormorant Garamond', serif;
font-size: 36px; font-weight: 700; color: var(--gold-light); line-height: 1;
}
.hero-stat-label { font-size: 12px; color: rgba(255,255,255,0.45); margin-top: 4px; letter-spacing: 0.5px; text-transform: uppercase; }
/* Hero Card */
.hero-card {
background: rgba(255,255,255,0.07);
border: 1px solid rgba(255,255,255,0.12);
border-radius: 20px;
padding: 32px;
backdrop-filter: blur(20px);
}
.hero-card-title { font-size: 13px; font-weight: 600; color: var(--gold-light); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 20px; }
.mini-profile {
display: flex; align-items: center; gap: 12px;
padding: 12px; border-radius: 12px;
background: rgba(255,255,255,0.05);
margin-bottom: 10px;
transition: background 0.2s; cursor: pointer;
}
.mini-profile:hover { background: rgba(255,255,255,0.1); }
.avatar {
width: 44px; height: 44px; border-radius: 12px;
display: flex; align-items: center; justify-content: center;
font-family: 'Cormorant Garamond', serif;
font-size: 18px; font-weight: 700; color: white;
flex-shrink: 0;
}
.av1 { background: linear-gradient(135deg, #8B2D3E, #C9973A); }
.av2 { background: linear-gradient(135deg, #2D5F8B, #3AC9C4); }
.av3 { background: linear-gradient(135deg, #5F8B2D, #C4C93A); }
.av4 { background: linear-gradient(135deg, #5F2D8B, #C43AC9); }
.mini-profile-info { flex: 1; min-width: 0; }
.mini-profile-name { font-size: 14px; font-weight: 600; color: white; }
.mini-profile-role { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.online-dot { width: 8px; height: 8px; border-radius: 50%; background: #4CAF50; flex-shrink: 0; }
.hero-card-cta { margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.1); text-align: center; }
.hero-card-cta a { font-size: 13px; font-weight: 500; color: var(--gold-light); text-decoration: none; }
.hero-card-cta a:hover { text-decoration: underline; }
/* ── SECTIONS ── */
section { padding: 96px 32px; }
.section-inner { max-width: 1280px; margin: 0 auto; }
.section-tag {
display: inline-block; font-size: 11px; font-weight: 700;
letter-spacing: 2px; text-transform: uppercase;
color: var(--maroon); background: rgba(107,27,42,0.08);
padding: 5px 14px; border-radius: 100px; margin-bottom: 16px;
}
.section-title {
font-family: 'Cormorant Garamond', serif;
font-size: clamp(32px, 4vw, 52px); font-weight: 700;
color: var(--gray-800); line-height: 1.15; margin-bottom: 16px;
}
.section-sub { font-size: 16px; color: var(--gray-400); line-height: 1.7; max-width: 580px; }
.section-header { margin-bottom: 56px; }
.section-header.centered { text-align: center; }
.section-header.centered .section-sub { margin: 0 auto; }
/* ── FEATURES ── */
.features-bg { background: #5EA8EE; }
.features-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.feature-card {
background: #ffffff; border-radius: var(--radius-lg);
padding: 36px 32px;
border: 1px solid rgba(255,255,255,0.6);
transition: all 0.3s;
position: relative; overflow: hidden;
}
.feature-card::before {
content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
background: linear-gradient(90deg, var(--maroon), var(--gold));
opacity: 0; transition: opacity 0.3s;
}
.feature-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
.feature-card:hover::before { opacity: 1; }
.feature-icon { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 20px; }
.fi-red { background: rgba(107,27,42,0.08); }
.fi-gold { background: rgba(201,151,58,0.1); }
.fi-blue { background: rgba(45,95,139,0.08); }
.fi-green { background: rgba(45,139,95,0.08); }
.fi-purple { background: rgba(95,45,139,0.08); }
.fi-teal { background: rgba(45,139,139,0.08); }
.feature-title { font-size: 17px; font-weight: 700; margin-bottom: 10px; color: var(--gray-800); }
.feature-desc { font-size: 14px; line-height: 1.65; color: var(--gray-400); }
/* ── ALUMNI DIRECTORY ── */
.alumni-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.alumni-card {
background: #ffffff; border-radius: var(--radius-lg);
padding: 28px 24px; text-align: center;
border: 1px solid rgba(255,255,255,0.6);
transition: all 0.3s; cursor: pointer;
position: relative;
}
.alumni-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); }
.alumni-avatar {
width: 72px; height: 72px; border-radius: 18px;
display: flex; align-items: center; justify-content: center;
font-family: 'Cormorant Garamond', serif;
font-size: 28px; font-weight: 700; color: white;
margin: 0 auto 16px;
}
.alumni-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; color: var(--gray-800); }
.alumni-role { font-size: 12.5px; color: var(--gray-400); margin-bottom: 12px; }
.alumni-tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.tag { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 100px; letter-spacing: 0.3px; }
.tag-maroon { background: rgba(107,27,42,0.08); color: var(--maroon); }
.tag-gold { background: rgba(201,151,58,0.1); color: #A07020; }
.tag-blue { background: rgba(45,95,139,0.08); color: #2D5F8B; }
.alumni-connect-btn {
display: block; margin-top: 16px;
width: 100%; padding: 8px; border-radius: 10px;
border: 1.5px solid var(--gray-100);
background: transparent; font-size: 13px; font-weight: 600;
color: var(--gray-400); cursor: pointer; transition: all 0.2s;
font-family: 'DM Sans', sans-serif;
}
.alumni-connect-btn:hover { border-color: var(--maroon); color: var(--maroon); }
.alumni-connect-btn.sent { border-color: #4CAF50; color: #4CAF50; }
/* ── JOBS ── */
.jobs-section { background: #5EA8EE; }
.jobs-list { display: flex; flex-direction: column; gap: 14px; }
.job-card {
background: #ffffff; border-radius: var(--radius);
padding: 24px 28px; border: 1px solid rgba(255,255,255,0.6);
display: flex; align-items: center; gap: 20px;
transition: all 0.2s; cursor: pointer;
}
.job-card:hover { border-color: var(--maroon); box-shadow: var(--shadow-sm); transform: translateX(4px); }
.job-logo { width: 52px; height: 52px; border-radius: 12px; background: var(--gray-50); border: 1px solid var(--gray-100); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
.job-info { flex: 1; min-width: 0; }
.job-title { font-size: 15px; font-weight: 700; color: var(--gray-800); margin-bottom: 4px; }
.job-company { font-size: 13px; color: var(--gray-400); }
.job-meta { display: flex; gap: 16px; margin-top: 8px; }
.job-meta-item { font-size: 12px; color: var(--gray-400); display: flex; align-items: center; gap: 4px; }
.job-type-badge { padding: 5px 12px; border-radius: 100px; font-size: 11.5px; font-weight: 600; flex-shrink: 0; }
.jt-full { background: rgba(76,175,80,0.1); color: #2E7D32; }
.jt-remote { background: rgba(45,95,139,0.1); color: #2D5F8B; }
.jt-intern { background: rgba(201,151,58,0.1); color: #A07020; }

/* ── POST JOB FORM ── */
.post-job-form {
background: #fff; border-radius: var(--radius-lg);
padding: 28px; margin-bottom: 24px;
border: 1.5px solid var(--maroon);
display: none;
}
.post-job-form.visible { display: block; }
.post-job-form h3 { font-size: 17px; font-weight: 700; color: var(--gray-800); margin-bottom: 18px; }
.pjf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.pjf-input {
width: 100%; padding: 10px 14px; border-radius: 10px;
border: 1.5px solid var(--gray-100); background: var(--gray-50);
font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--gray-800);
outline: none; transition: border-color 0.2s;
}
.pjf-input:focus { border-color: var(--maroon); background: white; }
.pjf-select {
width: 100%; padding: 10px 14px; border-radius: 10px;
border: 1.5px solid var(--gray-100); background: var(--gray-50);
font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--gray-800);
outline: none; cursor: pointer;
}
.pjf-actions { display: flex; gap: 10px; margin-top: 16px; }

/* ── EVENTS ── */
.events-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.event-card {
background: #ffffff; border-radius: var(--radius-lg);
overflow: hidden; border: 1px solid rgba(255,255,255,0.6);
transition: all 0.3s; cursor: pointer; display: flex;
}
.event-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
.event-card.featured { grid-column: span 2; }
.event-date-col {
width: 80px; flex-shrink: 0;
background: var(--maroon);
display: flex; flex-direction: column; align-items: center; justify-content: center;
padding: 20px 10px;
}
.event-date-mon { font-size: 11px; font-weight: 700; color: #7AB8F5; letter-spacing: 1px; text-transform: uppercase; }
.event-date-day { font-family: 'Cormorant Garamond', serif; font-size: 38px; font-weight: 700; color: white; line-height: 1; }
.event-body { padding: 24px; flex: 1; }
.event-type-badge {
display: inline-block; font-size: 10.5px; font-weight: 700;
letter-spacing: 0.5px; text-transform: uppercase;
padding: 4px 10px; border-radius: 100px; margin-bottom: 10px;
}
.et-networking { background: rgba(107,27,42,0.08); color: var(--maroon); }
.et-career { background: rgba(201,151,58,0.1); color: #A07020; }
.et-workshop { background: rgba(45,95,139,0.08); color: #2D5F8B; }
.et-conference { background: rgba(45,139,95,0.08); color: #2E7D32; }
.event-title { font-size: 17px; font-weight: 700; color: var(--gray-800); margin-bottom: 8px; }
.event-desc { font-size: 13.5px; color: var(--gray-400); line-height: 1.6; margin-bottom: 14px; }
.event-meta { display: flex; gap: 16px; }
.event-meta-item { font-size: 12px; color: var(--gray-400); display: flex; align-items: center; gap: 5px; }
/* ── MENTORSHIP ── */
.mentorship-section { background: var(--maroon-deep); position: relative; overflow: hidden; }
.mentorship-section::before {
content: ''; position: absolute; inset: 0;
background: radial-gradient(ellipse 70% 70% at 80% 50%, rgba(122,184,245,0.12) 0%, transparent 60%);
}
.mentorship-inner { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center; position: relative; z-index: 1; }
.mentorship-text .section-tag { background: rgba(122,184,245,0.15); color: var(--gold-light); }
.mentorship-text .section-title { color: white; }
.mentorship-text .section-sub { color: rgba(255,255,255,0.55); max-width: none; }
.mentorship-steps { margin-top: 36px; display: flex; flex-direction: column; gap: 20px; }
.mstep { display: flex; gap: 16px; align-items: flex-start; }
.mstep-num {
width: 36px; height: 36px; border-radius: 10px;
border: 1.5px solid rgba(122,184,245,0.4);
display: flex; align-items: center; justify-content: center;
font-size: 14px; font-weight: 700; color: var(--gold-light); flex-shrink: 0;
}
.mstep-text h4 { font-size: 14.5px; font-weight: 700; color: white; margin-bottom: 4px; }
.mstep-text p { font-size: 13px; color: rgba(255,255,255,0.45); line-height: 1.6; }
.mentorship-cards { display: flex; flex-direction: column; gap: 14px; }
.mentor-card {
background: rgba(255,255,255,0.06);
border: 1px solid rgba(255,255,255,0.1);
border-radius: var(--radius-lg); padding: 20px;
display: flex; gap: 16px; align-items: center;
transition: background 0.2s; cursor: pointer;
}
.mentor-card:hover { background: rgba(255,255,255,0.1); }
.mentor-info { flex: 1; }
.mentor-name { font-size: 15px; font-weight: 700; color: white; }
.mentor-expertise { font-size: 12px; color: rgba(255,255,255,0.45); margin-top: 3px; }
.mentor-stat { font-size: 11.5px; color: var(--gold-light); margin-top: 8px; }
/* ── NEWS ── */
.news-section { background: #5EA8EE; }
.news-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.news-card {
background: #ffffff; border-radius: var(--radius-lg);
overflow: hidden; border: 1px solid rgba(255,255,255,0.6);
transition: all 0.3s; cursor: pointer;
}
.news-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
.news-img { height: 180px; display: flex; align-items: center; justify-content: center; font-size: 48px; position: relative; overflow: hidden; }
.news-body { padding: 24px; }
.news-category { font-size: 10.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--maroon); margin-bottom: 10px; }
.news-title { font-size: 16px; font-weight: 700; color: var(--gray-800); margin-bottom: 10px; line-height: 1.4; }
.news-excerpt { font-size: 13px; color: var(--gray-400); line-height: 1.6; margin-bottom: 16px; }
.news-footer { display: flex; align-items: center; justify-content: space-between; }
.news-date { font-size: 11.5px; color: var(--gray-400); }
.news-read { font-size: 12.5px; font-weight: 600; color: var(--maroon); text-decoration: none; }
.news-read:hover { text-decoration: underline; }
/* ── BUSINESS DIRECTORY ── */
.biz-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.biz-card {
background: #ffffff; border-radius: var(--radius-lg);
padding: 28px; border: 1px solid rgba(255,255,255,0.6);
transition: all 0.3s; cursor: pointer;
}
.biz-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
.biz-header { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.biz-icon { width: 48px; height: 48px; border-radius: 12px; font-size: 22px; display: flex; align-items: center; justify-content: center; }
.biz-name { font-size: 15px; font-weight: 700; color: var(--gray-800); }
.biz-sector { font-size: 12px; color: var(--gray-400); margin-top: 2px; }
.biz-desc { font-size: 13px; color: var(--gray-400); line-height: 1.6; margin-bottom: 14px; }
.biz-owner { display: flex; align-items: center; gap: 8px; }
.biz-owner-dot { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: white; }
.biz-owner-info { font-size: 12px; color: var(--gray-400); }
.biz-owner-info b { font-weight: 600; color: var(--gray-600); }
/* ── CTA ── */
.cta-section {
background: linear-gradient(135deg, var(--maroon-deep) 0%, var(--maroon) 50%, #2D72E0 100%);
text-align: center; padding: 100px 32px; position: relative; overflow: hidden;
}
.cta-section::before {
content: ''; position: absolute; inset: 0;
background: radial-gradient(ellipse 60% 80% at 50% 0%, rgba(122,184,245,0.18) 0%, transparent 60%);
}
.cta-title {
font-family: 'Cormorant Garamond', serif;
font-size: clamp(36px, 5vw, 64px); font-weight: 700;
color: white; margin-bottom: 20px; position: relative;
}
.cta-sub { font-size: 17px; color: rgba(255,255,255,0.6); max-width: 560px; margin: 0 auto 40px; line-height: 1.7; position: relative; }
.cta-actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; position: relative; }
.btn-white { background: white; color: var(--maroon); font-weight: 700; }
.btn-white:hover { background: var(--cream); transform: translateY(-1px); }
.btn-outline-white { background: transparent; border: 1.5px solid rgba(255,255,255,0.3); color: white; }
.btn-outline-white:hover { border-color: white; background: rgba(255,255,255,0.08); }
/* ── FOOTER ── */
footer {
background: var(--gray-800);
padding: 64px 32px 32px;
color: rgba(255,255,255,0.5);
}
.footer-inner { max-width: 1280px; margin: 0 auto; }
.footer-top { display: grid; grid-template-columns: 280px 1fr; gap: 80px; margin-bottom: 48px; }
.footer-logo { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 700; color: white; margin-bottom: 14px; }
.footer-logo span { color: #7AB8F5; }
.footer-brand-desc { font-size: 13px; line-height: 1.7; margin-bottom: 20px; }
.footer-motto { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 14px; color: #7AB8F5; opacity: 0.7; }
.footer-links-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
.footer-col-title { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.7); margin-bottom: 16px; }
.footer-col a { display: block; font-size: 13px; color: rgba(255,255,255,0.4); text-decoration: none; margin-bottom: 10px; transition: color 0.2s; }
.footer-col a:hover { color: #7AB8F5; }
.footer-bottom {
border-top: 1px solid rgba(255,255,255,0.08);
padding-top: 24px;
display: flex; justify-content: space-between; align-items: center;
font-size: 12.5px;
}
.footer-bottom a { color: rgba(255,255,255,0.35); text-decoration: none; }
.footer-bottom a:hover { color: #7AB8F5; }
/* ── MODAL ── */
.modal-overlay {
display: none; position: fixed; inset: 0; z-index: 2000;
background: rgba(42,39,34,0.7); backdrop-filter: blur(8px);
align-items: center; justify-content: center; padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal {
background: #ffffff; border-radius: 24px; width: 100%; max-width: 440px;
padding: 40px; position: relative; overflow: hidden;
animation: modalIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes modalIn {
from { opacity: 0; transform: scale(0.9) translateY(20px); }
to { opacity: 1; transform: scale(1) translateY(0); }
}
.modal::before {
content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
background: linear-gradient(90deg, var(--maroon), var(--gold));
}
.modal-close {
position: absolute; top: 16px; right: 16px;
width: 32px; height: 32px; border-radius: 8px; border: none;
background: var(--gray-50); cursor: pointer; font-size: 16px; color: var(--gray-400);
display: flex; align-items: center; justify-content: center;
transition: all 0.2s;
}
.modal-close:hover { background: var(--gray-100); color: var(--gray-800); }
.modal-logo { text-align: center; margin-bottom: 28px; }
.modal-logo-mark {
width: 56px; height: 56px; background: var(--maroon); border-radius: 16px;
display: flex; align-items: center; justify-content: center;
font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 700;
color: #7AB8F5; margin: 0 auto 14px;
}
.modal-title { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 700; color: var(--gray-800); }
.modal-sub { font-size: 13.5px; color: var(--gray-400); margin-top: 4px; }
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 12.5px; font-weight: 600; color: var(--gray-600); margin-bottom: 6px; }
.form-input {
width: 100%; padding: 11px 14px; border-radius: 10px;
border: 1.5px solid var(--gray-100); background: var(--gray-50);
font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--gray-800);
transition: border-color 0.2s; outline: none;
}
.form-input:focus { border-color: var(--maroon); background: white; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-btn { width: 100%; padding: 13px; margin-top: 8px; }
.form-switch { text-align: center; margin-top: 16px; font-size: 13px; color: var(--gray-400); }
.form-switch a { color: var(--maroon); font-weight: 600; cursor: pointer; text-decoration: none; }
.form-switch a:hover { text-decoration: underline; }
.form-divider { display: flex; align-items: center; gap: 12px; margin: 16px 0; }
.form-divider-line { flex: 1; height: 1px; background: var(--gray-100); }
.form-divider-text { font-size: 11.5px; color: var(--gray-400); }
.social-btn {
width: 100%; padding: 10px; border-radius: 10px;
border: 1.5px solid var(--gray-100); background: white;
font-family: 'DM Sans', sans-serif; font-size: 13.5px; font-weight: 500;
cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px;
color: var(--gray-600);
}
.social-btn:hover { border-color: var(--gray-200); background: var(--gray-50); }
.form-error { font-size: 12.5px; color: #e53935; margin-top: 8px; text-align: center; min-height: 18px; }
/* ── SEARCH BAR ── */
.search-input-wrap { flex: 1; position: relative; }
.search-input {
width: 100%; padding: 10px 14px 10px 42px;
border-radius: 10px; border: 1.5px solid var(--gray-100);
background: var(--gray-50); font-family: 'DM Sans', sans-serif;
font-size: 14px; color: var(--gray-800); outline: none; transition: all 0.2s;
}
.search-input:focus { border-color: var(--maroon); background: white; }
.filter-btn {
padding: 10px 16px; border-radius: 10px; border: 1.5px solid var(--gray-100);
background: white; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
cursor: pointer; transition: all 0.2s; color: var(--gray-600); display: flex; align-items: center; gap: 6px;
}
.filter-btn:hover { border-color: var(--maroon); color: var(--maroon); }
.filter-btn.active { border-color: var(--maroon); color: var(--maroon); background: rgba(107,27,42,0.05); }
/* ── Loading skeleton ── */
.skeleton {
background: linear-gradient(90deg, #e8f0fb 25%, #d4e8f8 50%, #e8f0fb 75%);
background-size: 200% 100%;
animation: shimmer 1.5s infinite;
border-radius: 8px;
}
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--gray-50); }
::-webkit-scrollbar-thumb { background: var(--gray-200); border-radius: 3px; }
/* ── Responsive ── */
@media (max-width: 1100px) {
.features-grid { grid-template-columns: repeat(2, 1fr); }
.alumni-grid { grid-template-columns: repeat(2, 1fr); }
.news-grid { grid-template-columns: repeat(2, 1fr); }
.biz-grid { grid-template-columns: repeat(2, 1fr); }
.footer-links-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 860px) {
.hero-inner { grid-template-columns: 1fr; }
.hero-card { display: none; }
.mentorship-inner { grid-template-columns: 1fr; }
.events-grid { grid-template-columns: 1fr; }
.event-card.featured { grid-column: span 1; }
.footer-top { grid-template-columns: 1fr; gap: 40px; }
.nav-links { display: none; }
.pjf-grid { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
section { padding: 64px 20px; }
.features-grid, .alumni-grid, .news-grid, .biz-grid { grid-template-columns: 1fr; }
.footer-links-grid { grid-template-columns: 1fr 1fr; }
}
/* Animations */
.fade-up { opacity: 0; transform: translateY(30px); transition: opacity 0.6s, transform 0.6s; }
.fade-up.visible { opacity: 1; transform: translateY(0); }
/* Toast */
.toast {
position: fixed; bottom: 32px; right: 32px; z-index: 9999;
background: var(--gray-800); color: white; padding: 14px 20px;
border-radius: 12px; font-size: 13.5px; font-weight: 500;
box-shadow: var(--shadow-lg); transform: translateY(100px); opacity: 0;
transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
display: flex; align-items: center; gap: 10px;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast-icon { font-size: 16px; }
</style>
